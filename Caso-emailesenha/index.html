<html><head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Produtos</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

:root {
    --primary-color: #2c3e50;
    --secondary-color: #3498db;
    --accent-color: #e74c3c;
    --light-color: #ecf0f1;
}

body {
    min-height: 100vh;
    background: linear-gradient(45deg, #2c3e50, #3498db);
}

.login-container, .register-container, .forgot-container {
    max-width: 400px;
    margin: 50px auto;
    padding: 2rem;
    background: white;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}

.dashboard {
    max-width: 1200px;
    margin: 20px auto;
    padding: 20px;
}

.nav-menu {
    background: var(--primary-color);
    padding: 1rem;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav-menu h1 {
    margin: 0;
}

.nav-menu .user-actions {
    display: flex;
    gap: 1rem;
}

.card {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    margin-top: 20px;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

.form-group {
    margin-bottom: 1rem;
}

label {
    display: block;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
}

input {
    width: 100%;
    padding: 0.8rem;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 1rem;
}

button {
    background: var(--secondary-color);
    color: white;
    padding: 0.8rem 1.5rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 1rem;
    transition: background 0.3s ease;
}

button:hover {
    background: #2980b9;
}

.link-button {
    background: none;
    border: none;
    color: var(--secondary-color);
    cursor: pointer;
    text-decoration: underline;
    padding: 0.5rem;
}

.links {
    margin-top: 1rem;
    text-align: center;
}

.product-list {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
}

.product-list th,
.product-list td {
    padding: 1rem;
    text-align: left;
    border-bottom: 1px solid #ddd;
}

.product-list th {
    background: var(--primary-color);
    color: white;
}

.action-btn {
    padding: 0.5rem 1rem;
    margin: 0 0.2rem;
}

.edit-btn {
    background: var(--secondary-color);
}

.delete-btn {
    background: var(--accent-color);
}

.hidden {
    display: none;
}

.menu-card {
    background: white;
    padding: 2rem;
    border-radius: 8px;
    margin: 1rem;
    text-align: center;
    cursor: pointer;
    transition: transform 0.3s ease;
}

.menu-card:hover {
    transform: translateY(-5px);
}

.menu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 2rem;
    padding: 2rem;
}

</style>
</head>
<body>

<!-- Login Page -->
<div id="loginPage" class="login-container">
    <h2 style="text-align: center; margin-bottom: 2rem;">Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" required>
            <span id="emailError" style="color: var(--accent-color); font-size:0.9rem; display:none;"></span>
        </div>
        <div class="form-group">
            <label for="password">Senha:</label>
            <input type="password" id="password" required>
            <span id="passwordError" style="color: var(--accent-color); font-size:0.9rem; display:none;"></span>
        </div>
        <button type="submit" style="width: 100%;">Entrar</button>
        <div class="links">
            <button type="button" class="link-button" onclick="showForgotPassword()">Esqueci minha senha</button>
            <button type="button" class="link-button" onclick="showRegister()">Criar nova conta</button>
        </div>
    </form>
</div>

<!-- Register Page -->
<div id="registerPage" class="register-container hidden">
    <h2 style="text-align: center; margin-bottom: 2rem;">Criar Conta</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="regName">Nome:</label>
            <input type="text" id="regName" required>
        </div>
        <div class="form-group">
            <label for="regEmail">Email:</label>
            <input type="email" id="regEmail" required>
        </div>
        <div class="form-group">
            <label for="regPassword">Senha:</label>
            <input type="password" id="regPassword" required>
        </div>
        <div class="form-group">
            <label for="regConfirmPassword">Confirmar Senha:</label>
            <input type="password" id="regConfirmPassword" required>
        </div>
        <button type="submit" style="width: 100%;">Cadastrar</button>
        <div class="links">
            <button type="button" class="link-button" onclick="showLogin()">Voltar para login</button>
        </div>
    </form>
</div>

<!-- Forgot Password Page -->
<div id="forgotPasswordPage" class="forgot-container hidden">
    <h2 style="text-align: center; margin-bottom: 2rem;">Recuperar Senha</h2>
    <form id="forgotPasswordForm">
        <div class="form-group">
            <label for="forgotEmail">Email:</label>
            <input type="email" id="forgotEmail" required>
        </div>
        <button type="submit" style="width: 100%;">Enviar link de recuperação</button>
        <div class="links">
            <button type="button" class="link-button" onclick="showLogin()">Voltar para login</button>
        </div>
    </form>
</div>

<!-- Dashboard -->
<div id="dashboardPage" class="hidden">
    <div class="nav-menu">
        <h1>Sistema de Produtos</h1>
        <div class="user-actions">
            <span id="userEmail"></span>
            <button onclick="logout()">Sair</button>
        </div>
    </div>

    <div class="dashboard">
        <div class="menu-grid">
            <div class="menu-card" onclick="showProductForm()">
                <h3>Cadastrar Produto</h3>
                <p>Adicionar novo produto ao sistema</p>
            </div>
            <div class="menu-card" onclick="showProductList()">
                <h3>Listar Produtos</h3>
                <p>Visualizar e gerenciar produtos</p>
            </div>
        </div>

        <!-- Product Form -->
        <div id="productFormCard" class="card hidden">
            <h2>Cadastro de Produto</h2>
            <form id="productForm">
                <input type="hidden" id="productId">
                <div class="form-group">
                    <label for="productName">Nome do Produto:</label>
                    <input type="text" id="productName" required>
                </div>
                <div class="form-group">
                    <label for="productPrice">Preço:</label>
                    <input type="number" id="productPrice" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="productQuantity">Quantidade:</label>
                    <input type="number" id="productQuantity" required>
                </div>
                <button type="submit">Salvar Produto</button>
                <button type="button" onclick="hideProductForm()">Cancelar</button>
            </form>
        </div>

        <!-- Product List -->
        <div id="productListCard" class="card hidden">
            <h2>Lista de Produtos</h2>
            <table class="product-list">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Preço</th>
                        <th>Quantidade</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// Data Storage
let products = JSON.parse(localStorage.getItem('products')) || [];
let currentUser = null;

// Usuários válidos para simulação (em um sistema real, isso estaria no backend)
const validUsers = [
    { email: 'admin@example.com', password: '123456' },
    { email: 'user@example.com', password: 'abcdef' }
];

// Função para verificar credenciais
function checkCredentials(email, password) {
    return validUsers.find(user => user.email === email && user.password === password);
}

// Page Navigation Functions
function showLogin() {
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('registerPage').classList.add('hidden');
    document.getElementById('forgotPasswordPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.add('hidden');
}

function showRegister() {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('registerPage').classList.remove('hidden');
    document.getElementById('forgotPasswordPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.add('hidden');
}

function showForgotPassword() {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('registerPage').classList.add('hidden');
    document.getElementById('forgotPasswordPage').classList.remove('hidden');
    document.getElementById('dashboardPage').classList.add('hidden');
}

function showDashboard() {
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('registerPage').classList.add('hidden');
    document.getElementById('forgotPasswordPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    document.getElementById('userEmail').textContent = currentUser;
}

// Form Handlers
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    // Validação antes de efetuar login
    const emailErrorEl = document.getElementById('emailError');
    const passwordErrorEl = document.getElementById('passwordError');
    let hasError = false;

    // Email simples por regex
    function isValidEmail(mail) {
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(mail);
    }

    // Senha mínima: 6 caracteres (ajustável)
    function isValidPassword(pwd) {
        return typeof pwd === 'string' && pwd.length >= 6;
    }

    // Reset errors
    emailErrorEl.style.display = 'none';
    passwordErrorEl.style.display = 'none';
    emailErrorEl.textContent = '';
    passwordErrorEl.textContent = '';

    if (!isValidEmail(email)) {
        emailErrorEl.textContent = 'Informe um email válido.';
        emailErrorEl.style.display = 'block';
        hasError = true;
    }

    if (!isValidPassword(password)) {
        passwordErrorEl.textContent = 'Senha deve ter pelo menos 6 caracteres.';
        passwordErrorEl.style.display = 'block';
        hasError = true;
    }

    if (hasError) return;

    // Verificar se as credenciais são válidas
    const user = checkCredentials(email, password);
    if (!user) {
        emailErrorEl.textContent = 'Usuário ou senha estão incorretos';
        emailErrorEl.style.display = 'block';
        passwordErrorEl.textContent = 'Usuário ou senha estão incorretos';
        passwordErrorEl.style.display = 'block';
        return;
    }

    // Login bem sucedido
    currentUser = email;
    showDashboard();
});

// Limpar erros ao digitar
document.getElementById('email').addEventListener('input', function() {
    const el = document.getElementById('emailError');
    if (el) { el.style.display = 'none'; el.textContent = ''; }
});

document.getElementById('password').addEventListener('input', function() {
    const el = document.getElementById('passwordError');
    if (el) { el.style.display = 'none'; el.textContent = ''; }
});

document.getElementById('registerForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('regConfirmPassword').value;
    
    if (password !== confirmPassword) {
        alert('As senhas não coincidem!');
        return;
    }
    
    alert('Conta criada com sucesso!');
    showLogin();
});

document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
    e.preventDefault();
    alert('Link de recuperação enviado para o email informado.');
    showLogin();
});

// Product Management Functions
function showProductForm() {
    document.getElementById('productFormCard').classList.remove('hidden');
    document.getElementById('productListCard').classList.add('hidden');
}

function hideProductForm() {
    document.getElementById('productFormCard').classList.add('hidden');
    document.getElementById('productForm').reset();
    document.getElementById('productId').value = '';
}

function showProductList() {
    document.getElementById('productListCard').classList.remove('hidden');
    document.getElementById('productFormCard').classList.add('hidden');
    renderProducts();
}

document.getElementById('productForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const productId = document.getElementById('productId').value;
    const product = {
        id: productId || Date.now().toString(),
        name: document.getElementById('productName').value,
        price: document.getElementById('productPrice').value,
        quantity: document.getElementById('productQuantity').value
    };
    
    if (productId) {
        const index = products.findIndex(p => p.id === productId);
        products[index] = product;
    } else {
        products.push(product);
    }
    
    localStorage.setItem('products', JSON.stringify(products));
    hideProductForm();
    showProductList();
});

function editProduct(id) {
    const product = products.find(p => p.id === id);
    if (product) {
        document.getElementById('productId').value = product.id;
        document.getElementById('productName').value = product.name;
        document.getElementById('productPrice').value = product.price;
        document.getElementById('productQuantity').value = product.quantity;
        showProductForm();
    }
}

function deleteProduct(id) {
    if (confirm('Tem certeza que deseja excluir este produto?')) {
        products = products.filter(p => p.id !== id);
        localStorage.setItem('products', JSON.stringify(products));
        renderProducts();
    }
}

function renderProducts() {
    const tbody = document.getElementById('productTableBody');
    tbody.innerHTML = '';
    
    products.forEach(product => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${product.name}</td>
            <td>R$ ${parseFloat(product.price).toFixed(2)}</td>
            <td>${product.quantity}</td>
            <td>
                <button class="action-btn edit-btn" onclick="editProduct('${product.id}')">Editar</button>
                <button class="action-btn delete-btn" onclick="deleteProduct('${product.id}')">Excluir</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function logout() {
    currentUser = null;
    showLogin();
}

// Initialize
showLogin();
</script>
</body></html>
